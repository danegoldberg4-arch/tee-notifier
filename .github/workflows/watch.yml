name: Watch

on:
  schedule:
    - cron: '*/10 22-23,0-9 * * *'
  workflow_dispatch:

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: /tmp/state
          key: state-never-hit
          restore-keys: |
            state-

      - name: Run watcher
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          STATE_DIR: /tmp/state
        run: mkdir -p /tmp/state && python3 watcher.py

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /tmp/state
          key: state-${{ github.run_id }}-${{ github.run_attempt }}
