name: Watch

on:
  # Dispatch-only: GitHub's scheduler throttles frequent crons to ~3 runs/day
  # (observed at both */10 and */20), so cadence comes from an external pinger
  # hitting workflow_dispatch every 20 min. See README for pinger setup.
  workflow_dispatch:

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: /tmp/state
          key: state-never-hit
          restore-keys: |
            state-

      - name: Run watcher
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_DASHBOARD_WEBHOOK_URL: ${{ secrets.DISCORD_DASHBOARD_WEBHOOK_URL }}
          STATE_DIR: /tmp/state
        run: mkdir -p /tmp/state && python3 watcher.py

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /tmp/state
          key: state-${{ github.run_id }}-${{ github.run_attempt }}
